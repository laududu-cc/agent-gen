<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智戎 - 智能体生成器</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/atom-one-dark.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: rgba(24, 24, 27, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --msg-user: #27272a;
            --msg-sys: rgba(99, 102, 241, 0.1);
            --msg-tool: rgba(16, 185, 129, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background */
        .ambient-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            z-index: -1;
        }
        .blob {
            position: absolute;
            filter: blur(100px);
            opacity: 0.5;
            border-radius: 50%;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 {
            top: -10%; left: -10%;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(99,102,241,0.3) 0%, transparent 70%);
        }
        .blob-2 {
            bottom: -10%; right: -10%;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(16,185,129,0.2) 0%, transparent 70%);
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(5%, 5%); }
        }

        /* Sidebar Layer */
        .sidebar {
            width: 280px;
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-left: 0;
            z-index: 100;
        }
        .sidebar.collapsed {
            margin-left: -280px;
        }

        .sidebar-header {
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-header h2 {
            font-size: 16px;
            font-weight: 600;
        }
        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            padding: 4px;
            border-radius: 6px;
        }
        .close-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .agent-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .agent-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .agent-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.3);
        }
        .agent-card.active {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.4);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 500;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .agent-card:hover .card-actions { opacity: 1; }
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }
        .action-btn:hover { color: var(--text-main); }
        .action-btn.delete:hover { color: #ef4444; }
        
        .card-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(161, 161, 170, 0.2);
            color: var(--text-muted);
        }
        .card-badge.tool {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .manage-page-btn {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        .manage-page-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .new-agent-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .new-agent-btn:hover { background: var(--accent-hover); }

        /* Main Content Layout */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .toggle-sidebar-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(24, 24, 27, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s, transform 0.3s;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-10px);
        }
        .toggle-sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .toggle-sidebar-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            position: relative;
        }

        /* Header (Test Mode) */
        .header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.5s ease;
            display: none;
        }
        .header.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }
        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-main); }
        
        .agent-info { display: flex; align-items: center; gap: 12px; }
        .agent-name { font-weight: 600; font-size: 16px; }
        .agent-badge {
            font-size: 12px; padding: 4px 8px; border-radius: 12px;
            background: rgba(99, 102, 241, 0.2); color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
            align-items: center;
        }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        /* Initial Hero State */
        .hero-state {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hero-state h1 {
            font-size: 42px; font-weight: 600; margin-bottom: 16px;
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-state p { color: var(--text-muted); font-size: 18px; margin-bottom: 40px; }
        .hero-state.hidden {
            opacity: 0; pointer-events: none;
            transform: translate(-50%, -60%);
        }

        /* Messages */
        .message-wrapper {
            width: 100%; max-width: 800px; padding: 0 20px;
            display: flex; flex-direction: column; gap: 8px;
            opacity: 0; transform: translateY(10px);
            animation: fadeIn 0.4s forwards;
        }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .message {
            max-width: 80%; padding: 16px 20px; border-radius: 16px;
            font-size: 15px; line-height: 1.6;
        }
        .msg-user { align-self: flex-end; background: var(--msg-user); border-bottom-right-radius: 4px; }
        .msg-sys { align-self: flex-start; background: var(--msg-sys); border: 1px solid rgba(99, 102, 241, 0.2); border-bottom-left-radius: 4px; }
        
        /* Markdown Styles */
        .msg-sys pre {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .msg-sys code {
            font-family: monospace;
            font-size: 13px;
        }
        .msg-sys p { margin-bottom: 8px; }
        .msg-sys p:last-child { margin-bottom: 0; }
        .msg-sys ul, .msg-sys ol { margin-left: 20px; margin-bottom: 8px; }
        .msg-sys a { color: var(--accent); }
        
        .tool-log {
            align-self: flex-start; background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--border-color); border-radius: 12px;
            padding: 12px 16px; font-size: 13px; color: var(--text-muted);
            max-width: 80%; font-family: monospace;
        }
        .tool-log-header { display: flex; align-items: center; gap: 8px; color: #34d399; margin-bottom: 8px; }
        .tool-log-content { padding-left: 14px; border-left: 2px solid rgba(255,255,255,0.1); }

        /* Input Area */
        .input-area {
            padding: 24px 0;
            background: linear-gradient(to top, var(--bg-color) 80%, transparent);
            transition: all 0.5s;
            display: flex; justify-content: center;
        }
        .hero-state + .input-area {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, 20px);
            width: 100%; max-width: 800px; padding: 0 20px; background: transparent;
        }
        .input-box {
            width: 100%; max-width: 800px; margin: 0 20px;
            position: relative; background: var(--panel-bg);
            border: 1px solid var(--border-color); border-radius: 24px;
            padding: 8px 16px; display: flex; align-items: flex-end;
            backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-box:focus-within {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.15);
        }
        .input-box textarea {
            flex: 1; background: transparent; border: none;
            color: var(--text-main); font-size: 16px; padding: 12px 0;
            resize: none; outline: none; min-height: 48px; max-height: 150px; line-height: 1.5;
        }
        .input-box textarea::placeholder { color: var(--text-muted); }
        .send-btn {
            background: var(--accent); color: white; border: none;
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; margin-bottom: 6px; transition: background 0.2s, transform 0.2s;
        }
        .send-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); }
        
        .loading-dots { display: flex; gap: 4px; padding: 16px 20px; }
        .dot { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        .tools-panel { font-size: 12px; color: var(--text-muted); display: flex; gap: 16px; }
        .tool-item { display: flex; align-items: center; gap: 4px; }
        .tool-dot { width: 6px; height: 6px; background: #34d399; border-radius: 50%; }

        /* Modals */
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:200; align-items:center; justify-content:center; }
        .modal-content { background:var(--panel-bg); border:1px solid var(--border-color); padding:24px; border-radius:12px; width:400px; backdrop-filter:blur(16px); }
        .btn { padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.2s; border: none; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.05); }

    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Sidebar / Agent Management (Open by default) -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>会话智能体</h2>
            <button class="close-btn" onclick="toggleSidebar()" title="收起列表">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
        </div>
        <div class="agent-list" id="agentList">
            <!-- Agents will be injected here from localStorage -->
        </div>
        <div class="sidebar-footer">
            <a href="manage.html" class="manage-page-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                前往管理控制台
            </a>
            <button class="new-agent-btn" onclick="resetApp()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                创建新智能体
            </button>
        </div>
    </div>

    <!-- Main Working Area -->
    <div class="main-content">
        <!-- Floating Expand Button (Visible when sidebar is collapsed) -->
        <button class="toggle-sidebar-btn" id="toggleBtn" onclick="toggleSidebar()" title="展开列表">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>

        <div class="app-container" id="app">
            <!-- Testing Phase Header -->
            <div class="header" id="header">
                <button class="back-btn" onclick="resetApp()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    清空并重来
                </button>
                <div class="agent-info">
                    <div class="agent-name" id="agentName">信息查询助手</div>
                    <div class="agent-badge" id="agentBadge">工具调用型</div>
                </div>
                <div class="tools-panel" id="toolsPanel" style="display: none;">
                    <div class="tool-item"><div class="tool-dot"></div>新闻查询</div>
                    <div class="tool-item"><div class="tool-dot"></div>天气查询</div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-container" id="chatArea">
                <div class="hero-state" id="hero">
                    <h1>智戎</h1>
                    <p>智能体生成器，描述需求，自动生成专属智能体</p>
                </div>
                <!-- Messages will be injected here -->
            </div>

            <!-- Input Area -->
            <div class="input-area" id="inputArea">
                <div class="input-box">
                    <textarea id="userInput" placeholder="例如：创建一个能帮我查新闻和天气的助手..." rows="1" oninput="autoResize(this)" onkeypress="handleKeyPress(event)"></textarea>
                    <button class="send-btn" onclick="sendMessage()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Rename Modal -->
    <div class="modal-overlay" id="renameModal" onclick="if(event.target===this) closeRenameModal()">
        <div class="modal-content">
            <h3 style="margin-bottom:16px;">重命名智能体</h3>
            <div style="margin-bottom:20px;">
                <input type="text" id="renameInput" style="width:100%; padding:10px; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); border-radius:6px; color:white; outline:none;" onkeypress="if(event.key==='Enter') saveRename()">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:12px;">
                <button class="btn btn-secondary" onclick="closeRenameModal()">取消</button>
                <button class="btn btn-primary" onclick="saveRename()">保存</button>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div class="modal-overlay" id="confirmModal" onclick="if(event.target===this) closeConfirmModal()">
        <div class="modal-content" style="width: 340px;">
            <h3 style="margin-bottom:12px; color:#ef4444;">删除智能体</h3>
            <p style="margin-bottom:20px; color:var(--text-muted); font-size:14px;">确定要删除这个智能体吗？相关的对话记录可能会受到影响。</p>
            <div style="display:flex; justify-content:flex-end; gap:12px;">
                <button class="btn btn-secondary" onclick="closeConfirmModal()">取消</button>
                <button class="btn btn-primary" style="background:#ef4444; color:white;" onclick="confirmDelete()">确定删除</button>
            </div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const hero = document.getElementById('hero');
        const inputArea = document.getElementById('inputArea');
        const header = document.getElementById('header');
        const toolsPanel = document.getElementById('toolsPanel');
        
        // Sidebar logic
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');
        
        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
            if (sidebar.classList.contains('collapsed')) {
                toggleBtn.classList.add('visible');
            } else {
                toggleBtn.classList.remove('visible');
            }
        }

        let activeAgentId = null;

        function deleteAgent(id) {
            activeAgentId = id;
            document.getElementById('confirmModal').style.display = 'flex';
        }
        function closeConfirmModal() { document.getElementById('confirmModal').style.display = 'none'; }
        function confirmDelete() {
            globalAgents = globalAgents.filter(a => a.id !== activeAgentId);
            renderSidebarAgents();
            closeConfirmModal();
            fetch(`/api/agents/${activeAgentId}`, { method: 'DELETE' });
        }

        function renameAgent(id) {
            activeAgentId = id;
            const agents = loadAgents();
            const agent = agents.find(a => a.id === id);
            document.getElementById('renameInput').value = agent.name;
            document.getElementById('renameModal').style.display = 'flex';
            setTimeout(() => document.getElementById('renameInput').focus(), 100);
        }
        function closeRenameModal() { document.getElementById('renameModal').style.display = 'none'; }
        function saveRename() {
            const newName = document.getElementById('renameInput').value.trim();
            if (newName) {
                const idx = globalAgents.findIndex(a => a.id === activeAgentId);
                if (idx > -1) {
                    globalAgents[idx].name = newName;
                    renderSidebarAgents();
                    fetch('/api/agents', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(globalAgents[idx])
                    });
                }
            }
            closeRenameModal();
        }

        let step = 0; // 0: initial, 1: creating, 2: testing
        let creationMessages = [];
        let agentMessages = [];
        let generatedAgent = null;

        // Configure marked to use highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        // Database Logic
        let globalAgents = [];
        
        async function fetchAgentsFromDB() {
            try {
                const res = await fetch('/api/agents');
                globalAgents = await res.json();
                renderSidebarAgents();
            } catch(e) { console.error('Failed to load agents'); }
        }

        function loadAgents() {
            return globalAgents;
        }

        function saveAgent(agent) {
            globalAgents.unshift(agent);
            renderSidebarAgents();
            fetch('/api/agents', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(agent)
            });
        }

        function renderSidebarAgents() {
            const agents = loadAgents();
            const listEl = document.getElementById('agentList');
            listEl.innerHTML = ''; // clear

            if (agents.length === 0) {
                listEl.innerHTML = '<div style="color:var(--text-muted); font-size:13px; text-align:center; padding: 20px 0;">暂无智能体</div>';
                return;
            }

            agents.forEach(agent => {
                const badgeClass = agent.type === '工具调用型' ? 'card-badge tool' : 'card-badge';
                const el = document.createElement('div');
                el.className = 'agent-card';
                el.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">${agent.name}</div>
                        <div class="card-actions">
                            <button class="action-btn" title="重命名" onclick="event.stopPropagation(); renameAgent('${agent.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
                            <button class="action-btn delete" title="删除" onclick="event.stopPropagation(); deleteAgent('${agent.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                        </div>
                    </div>
                    <div class="${badgeClass}">${agent.type}</div>
                `;
                listEl.appendChild(el);
            });
        }
        
        // Fetch agents from backend on load
        fetchAgentsFromDB();

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function appendMessage(role, text, isHtml = false) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            if (role === 'tool') {
                wrapper.innerHTML = text;
            } else {
                const msg = document.createElement('div');
                msg.className = `message msg-${role}`;
                if (isHtml) {
                    msg.innerHTML = text;
                } else if (role === 'sys') {
                    // Render Markdown for system
                    msg.innerHTML = marked.parse(text);
                } else {
                    // Simple newline to br replacement for text
                    msg.innerHTML = text.replace(/\n/g, '<br>');
                }
                wrapper.appendChild(msg);
            }
            chatArea.appendChild(wrapper);
            scrollToBottom();
        }

        function showTyping() {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper typing-indicator';
            wrapper.id = 'typing';
            const msg = document.createElement('div');
            msg.className = 'message msg-sys';
            msg.innerHTML = '<div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            wrapper.appendChild(msg);
            chatArea.appendChild(wrapper);
            scrollToBottom();
        }

        function removeTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function transitionToChatLayout() {
            hero.classList.add('hidden');
            setTimeout(() => { hero.style.display = 'none'; }, 600);
            chatArea.style.paddingTop = '60px'; 
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            
            if (step === 0 || step === 1) {
                if (step === 0) {
                    transitionToChatLayout();
                    step = 1;
                }
                
                appendMessage('user', text);
                creationMessages.push({ role: 'user', content: text });
                
                userInput.value = '';
                autoResize(userInput);
                
                // Create Assistant message wrapper
                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper';
                const msg = document.createElement('div');
                msg.className = 'message msg-sys';
                wrapper.appendChild(msg);
                chatArea.appendChild(wrapper);
                
                let fullContent = '';

                try {
                    const response = await fetch('/api/create-agent', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ messages: creationMessages, stream: true })
                    });
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep incomplete line

                        for (const line of lines) {
                            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                try {
                                    const parsed = JSON.parse(line.slice(6));
                                    if (parsed.content) {
                                        fullContent += parsed.content;
                                        // Hide XML block from UI during streaming
                                        let displayContent = fullContent.replace(/<AGENT_READY>[\s\S]*?(<\/AGENT_READY>)?/g, '');
                                        msg.innerHTML = marked.parse(displayContent);
                                        scrollToBottom();
                                    }
                                } catch (e) {}
                            }
                        }
                    }
                    
                    creationMessages.push({ role: 'assistant', content: fullContent });
                    
                    // Parse the XML for readiness
                    const readyMatch = fullContent.match(/<AGENT_READY>[\s\S]*?<NAME>(.*?)<\/NAME>[\s\S]*?<PROMPT>([\s\S]*?)<\/PROMPT>[\s\S]*?<\/AGENT_READY>/);
                    
                    if (readyMatch) {
                        const agentName = readyMatch[1].trim();
                        const systemPrompt = readyMatch[2].trim();
                        
                        generatedAgent = {
                            name: agentName,
                            systemPrompt: systemPrompt
                        };
                        
                        document.getElementById('agentName').innerText = agentName;
                        document.getElementById('agentBadge').innerText = '普通型';
                        
                        let displayContent = fullContent.replace(/<AGENT_READY>[\s\S]*?<\/AGENT_READY>/g, '');
                        msg.innerHTML = marked.parse(displayContent + `\n\n✅ **已成功创建「${agentName}」！即将进入工作区...**`);
                        scrollToBottom();
                        
                        const newId = Date.now().toString();
                        saveAgent({
                            id: newId,
                            name: agentName,
                            type: '普通型',
                            desc: systemPrompt.substring(0, 100) + '...',
                            systemPrompt: systemPrompt,
                            tools: []
                        });
                        
                        setTimeout(() => {
                            window.location.href = `test.html?id=${newId}`;
                        }, 2000);
                    }
                } catch (e) {
                    msg.innerHTML = '服务器请求失败，请检查网络。';
                }
            }
        }

        function resetApp() { location.reload(); }
    </script>
</body>
</html>
