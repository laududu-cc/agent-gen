<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智戎 - 管理控制台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: rgba(24, 24, 27, 0.4);
            --card-bg: rgba(39, 39, 42, 0.4);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --tool-color: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Background */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            z-index: -1;
        }
        .blob {
            position: absolute;
            filter: blur(120px);
            opacity: 0.4;
            border-radius: 50%;
            animation: float 15s infinite ease-in-out alternate;
        }
        .blob-1 {
            top: -20%; right: -10%;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, transparent 70%);
        }
        .blob-2 {
            bottom: -20%; left: -10%;
            width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(52,211,153,0.15) 0%, transparent 70%);
            animation-delay: -7s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-5%, 5%); }
        }

        /* Navigation */
        .navbar {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: rgba(9, 9, 11, 0.6);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border-color: var(--border-color);
        }
        .page-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        /* Main Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            width: 100%;
            flex: 1;
        }

        .header-section {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .header-text p {
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Grid Layout */
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* Card Styles */
        .agent-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .agent-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(161, 161, 170, 0.15);
            color: var(--text-muted);
            border: 1px solid rgba(161, 161, 170, 0.2);
        }
        .card-badge.tool {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border-color: rgba(99, 102, 241, 0.3);
        }

        .card-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }
        .card-info p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: auto;
        }
        .tool-tag {
            font-size: 12px;
            color: var(--tool-color);
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(52, 211, 153, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }
        .tool-tag .dot {
            width: 6px; height: 6px;
            background: var(--tool-color);
            border-radius: 50%;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 8px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-icon {
            flex: 0 0 auto;
            width: 38px;
            padding: 0;
            color: var(--text-muted);
        }
        .btn-icon:hover {
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.1);
        }

        /* Create New Card */
        .create-card {
            border: 1px dashed rgba(255,255,255,0.2);
            background: transparent;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
        }
        .create-card:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
            transform: translateY(-4px);
        }
        .create-icon {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .create-card:hover .create-icon {
            background: var(--accent);
            color: white;
            transform: scale(1.1);
        }
        .create-text h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        .create-text p {
            font-size: 14px;
            color: var(--text-muted);
        }

    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                返回工作区
            </a>
            <div class="page-title">智能体管理</div>
        </div>
        <div style="display: flex; align-items: center; gap: 20px; font-size: 14px; color: var(--text-muted);">
            <div style="display: flex; align-items: center; gap: 6px;">
                <span>👤</span>
                <span id="currentUserName">加载中...</span>
            </div>
            <button onclick="logout()" style="background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 13px; font-weight: 500;">
                退出登录
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <div class="header-text">
                <h1 style="font-size: 32px; font-weight: 600;">我的智能体</h1>
                <p>管理、测试或微调您创建的专属 AI 助手</p>
            </div>
        </div>

        <div class="agent-grid" id="agentGrid">
            <!-- Dynamic content injected by JS -->
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        const API_BASE = (window.location.protocol === 'file:' || window.location.port === '5500' || window.location.port === '5173')
            ? 'http://127.0.0.1:8000'
            : '';

        async function authFetch(url, options = {}) {
            const headers = options.headers || {};
            headers['Authorization'] = `Bearer ${token}`;
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                window.location.href = 'login.html';
            }
            return res;
        }

        // Set logged-in username in UI
        window.addEventListener('DOMContentLoaded', () => {
            const username = localStorage.getItem('username') || 'Unknown';
            const userEl = document.getElementById('currentUserName');
            if (userEl) userEl.innerText = username;
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            window.location.href = 'login.html';
        }

        let globalAgents = [];
        async function fetchAgentsFromDB() {
            try {
                const res = await authFetch(`${API_BASE}/api/agents`);
                globalAgents = await res.json();
                renderGrid();
            } catch(e) { console.error('Failed to load agents'); }
        }

        function loadAgents() {
            return globalAgents;
        }

        function renderGrid() {
            const agents = loadAgents();
            const grid = document.getElementById('agentGrid');
            grid.innerHTML = '';

            agents.forEach(agent => {
                const badgeClass = agent.type === '工具调用型' ? 'card-badge tool' : 'card-badge';
                const el = document.createElement('div');
                el.className = 'agent-card';
                el.innerHTML = `
                    <div class="card-top">
                        <div class="card-icon">🤖</div>
                        <div class="${badgeClass}">${agent.type}</div>
                    </div>
                    <div class="card-info">
                        <h3>${agent.name}</h3>
                        <p>${agent.desc}</p>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-primary" onclick="window.location.href='test.html?id=${agent.id}'">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            进入对话
                        </button>
                        <button class="btn btn-secondary" onclick="openSettings('${agent.id}')">设置</button>
                        <button class="btn btn-secondary btn-icon" title="删除" onclick="removeCard(this, '${agent.id}')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                `;
                grid.appendChild(el);
            });

            // Add the Create New card
            const createCard = document.createElement('a');
            createCard.href = 'index.html';
            createCard.className = 'agent-card create-card';
            createCard.innerHTML = `
                <div class="create-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                </div>
                <div class="create-text">
                    <h3>创建新智能体</h3>
                    <p>通过对话自动生成专属 Agent</p>
                </div>
            `;
            grid.appendChild(createCard);
        }

        // Initial render replaced by fetch
        fetchAgentsFromDB();

        function removeCard(btn, id) {
            if(confirm('确定要删除此智能体吗？')) {
                globalAgents = globalAgents.filter(a => a.id !== id);
                
                const card = btn.closest('.agent-card');
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                setTimeout(() => card.remove(), 300);
                
                authFetch(`${API_BASE}/api/agents/${id}`, { method: 'DELETE' });
            }
        }

        function openSettings(id) {
            const agents = loadAgents();
            const agent = agents.find(a => a.id === id);
            if(agent) {
                document.getElementById('editAgentId').value = agent.id;
                document.getElementById('editAgentName').value = agent.name;
                document.getElementById('editAgentPrompt').value = agent.systemPrompt || agent.desc || '';
                document.getElementById('settingsModal').style.display = 'flex';
            }
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveSettings() {
            const id = document.getElementById('editAgentId').value;
            const newName = document.getElementById('editAgentName').value;
            const newPrompt = document.getElementById('editAgentPrompt').value;
            
            const idx = globalAgents.findIndex(a => a.id === id);
            if (idx > -1) {
                globalAgents[idx].name = newName;
                globalAgents[idx].systemPrompt = newPrompt;
                globalAgents[idx].desc = newPrompt.substring(0, 100) + '...';
                renderGrid();
                closeSettings();
                authFetch(`${API_BASE}/api/agents`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(globalAgents[idx])
                });
            }
        }
    </script>
    
    <!-- Settings Modal -->
    <div id="settingsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:200; align-items:center; justify-content:center;">
        <div style="background:var(--panel-bg); border:1px solid var(--border-color); padding:24px; border-radius:12px; width:500px; backdrop-filter:blur(16px);">
            <h3 style="margin-bottom:16px;">智能体设置</h3>
            <input type="hidden" id="editAgentId">
            <div style="margin-bottom:12px;">
                <label style="display:block; margin-bottom:4px; font-size:14px; color:var(--text-muted);">名称</label>
                <input type="text" id="editAgentName" style="width:100%; padding:8px; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); border-radius:6px; color:white;">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:4px; font-size:14px; color:var(--text-muted);">系统提示词 (System Prompt)</label>
                <textarea id="editAgentPrompt" rows="8" style="width:100%; padding:8px; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); border-radius:6px; color:white; resize:vertical;"></textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:12px;">
                <button onclick="closeSettings()" class="btn btn-secondary" style="flex:none; padding:8px 16px;">取消</button>
                <button onclick="saveSettings()" class="btn btn-primary" style="flex:none; padding:8px 16px;">保存</button>
            </div>
        </div>
    </div>
</body>
</html>
